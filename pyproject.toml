[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriscore-predictor"
version = "0.1.0"
description = "Predict Nutriscore ratings for food products using ML on OpenFoodFacts data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["nutriscore", "machine-learning", "food", "nutrition", "openfoodfacts", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "jupyter>=1.0",
    "build>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

# ─────────────────────────────────────────────────────────────────────────────
# Ruff (linter + formatter)
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — ruff format handles this
    "UP007",  # X | Y union syntax — keep compat with 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["nutriscore"]
